name: Tide
options:
  bundleIdPrefix: org.izukawa
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: G5G54TCH8W
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    GCC_WARN_INHIBIT_ALL_WARNINGS: NO
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES

packages:
  AWSSwiftSDK:
    url: https://github.com/awslabs/aws-sdk-swift
    from: 1.7.3
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.10.0

targets:
  TideCore:
    type: framework
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: TideCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.izukawa.TideCore
        PRODUCT_NAME: TideCore
        DEFINES_MODULE: YES
        # framework にも Info.plist が要る（無いと codesign が bundle format 不正で失敗）。
        GENERATE_INFOPLIST_FILE: YES
        # 拡張(TideFileProvider)からもリンクするため拡張安全 API のみを強制する。
        # aws-sdk-swift は Apple では URLSession 既定でネットワークは Foundation、
        # fork/AppKit/@available(ApplicationExtension,unavailable) を含まない（Phase 0 調査）。
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: AWSSwiftSDK
        product: AWSS3
      - package: AWSSwiftSDK
        product: AWSClientRuntime
      - package: AWSSwiftSDK
        product: AWSSDKIdentity
      - package: GRDB
        product: GRDB

  Tide:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Tide
        excludes:
          - "Info.plist"
    info:
      path: Tide/Info.plist
      properties:
        LSUIElement: YES
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: Tide
        # バージョンは build settings（MARKETING_VERSION / CURRENT_PROJECT_VERSION）を唯一のソースにし、
        # Xcode がビルド時に Info.plist へ変数展開する（plist 側に数値を二重定義しない）。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "© 2026 Takanobu Izukawa"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
    # Data Protection Keychain (kSecUseDataProtectionKeychain=true) を使うには
    # keychain-access-groups entitlement が要る。無いと OSStatus 34018 (errSecMissingEntitlement)。
    entitlements:
      path: Tide/Tide.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)org.izukawa.Tide
        # App Group（M5 Phase 2）: DB / 設定を app と File Provider 拡張で共有する土台。
        # TideCore の TideAppGroup.identifier と一致させる。
        com.apple.security.application-groups:
          - group.org.izukawa.Tide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.izukawa.Tide
        PRODUCT_NAME: Tide
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        # バージョン運用ルール: docs / 計画のみのコミットでは上げない。
        # v0.2.0 タスク（GitHub #25〜#34）の実コード変更を最初に着地させるコミットで
        # MARKETING_VERSION を 0.1.1 に上げ、以降はタスク消化に応じて patch を刻む。
        # 機能セットが揃った節目で 0.2.0（minor）。リリースのタグはこの値を唯一のソースとする。
        # 0.1.1: #25 / A（アップロード側の並行更新検出）を着地（v0.2.0 タスクの最初の実コード）。
        # 0.1.2: #26 / B（HTTPS 強制バケットポリシー）を着地。
        # 0.2.0: v0.2.0 機能セット完了の節目（minor）。#27〜#34（ネスト .syncignore / 復元ピッカー /
        #   設定 export-import / 削除一覧キャッシュ / 配線結合テスト / NoFollow / dedupe / stale UploadId /
        #   pull-restore 直列化）を着地。#29(a) CopyObject はマニフェスト再設計前提で "not planned"。
        #   #33 等で省いた per-task patch bump はここで吸収（version はタスク数と 1:1 ではない）。
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: TideCore
      # AWS SDK は app 側で直接 import しない（S3 系は全て TideCore へ移動済み）。
      # TideCore 経由の transitive リンクで足りる。GRDB は SyncEngine が直接 import するため残す。
      - package: GRDB
        product: GRDB

  TideTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: TideTests
    dependencies:
      - target: Tide
      # core を TideCore framework へ分離したため、テストも TideCore と、
      # テスト内で直接使う GRDB API（fetchCount/filter/DatabasePool 等）にリンクする。
      - target: TideCore
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.izukawa.TideTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Tide.app/Contents/MacOS/Tide

schemes:
  Tide:
    build:
      targets:
        Tide: all
        TideTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TideTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
